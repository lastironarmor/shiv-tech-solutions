<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Shiv Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen text-white p-4">

    <div class="bg-gray-900 p-8 rounded-3xl w-full max-w-sm border border-gray-800 shadow-2xl">
        <h2 id="title" class="text-2xl font-black mb-6 text-center">Login</h2>
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Email</label>
                <input type="email" id="email" required class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Password</label>
                <input type="password" id="pass" required class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700">
            </div>
            <button type="submit" id="btn" class="w-full bg-indigo-600 p-3 rounded-xl font-bold">Login</button>
        </form>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwrX4vn_xXrXJoioF7JzpeuAQA9IuVSQ_nxdw5LAZWfZ0a17JBs74wUbrQ38c6xOFoYkQ/exec";

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value.trim();
            const btn = document.getElementById('btn');

            btn.innerText = "Checking...";
            
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                
                // यहाँ 2 का मतलब Email कॉलम और 3 का मतलब Password कॉलम है (Sheet के हिसाब से)
                const user = data.find(row => row[2] == email && row[3] == pass);
                
                if (user) {
                    alert("Login Success! ✅");
                } else {
                    alert("Login Failed: Email ya Password galat hai.");
                }
            } catch (err) {
                alert("Error: Server connect nahi ho pa raha. Check करें कि आपने 'Anyone' access सेट किया है या नहीं।");
            }
            btn.innerText = "Login";
        };
    </script>
</body>
</html>
