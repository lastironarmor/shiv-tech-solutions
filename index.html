<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Shiv Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen text-white p-4">

    <div class="bg-gray-900 p-8 rounded-3xl w-full max-w-sm border border-gray-800 shadow-2xl">
        <h2 id="title" class="text-2xl font-black mb-6 text-center">Login</h2>
        
        <form id="auth-form" class="space-y-4">
            <div id="name-box" class="hidden">
                <label class="block text-xs font-bold text-gray-500 uppercase">Full Name</label>
                <input type="text" id="reg-name" class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Email</label>
                <input type="email" id="email" required class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Password</label>
                <input type="password" id="pass" required class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700">
            </div>
            <button type="submit" id="btn" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded-xl font-bold transition">Login</button>
            <p onclick="toggle()" class="text-center text-xs text-indigo-400 cursor-pointer underline hover:text-indigo-300">Switch to Register / Login</p>
        </form>
    </div>

    <script>
        let isLogin = true;
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeburNLc2hGwXbV_i6qlJ-VS0CB9OI_tyA-EjpJcuY42MwK5g/formResponse";
        const SHEET_WEB_APP = "https://script.google.com/macros/s/AKfycbwrX4vn_xXrXJoioF7JzpeuAQA9IuVSQ_nxdw5LAZWfZ0a17JBs74wUbrQ38c6xOFoYkQ/exec";

        function toggle() {
            isLogin = !isLogin;
            document.getElementById('name-box').classList.toggle('hidden');
            document.getElementById('title').innerText = isLogin ? 'Login' : 'Register';
            document.getElementById('btn').innerText = isLogin ? 'Login' : 'Register';
        }

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value.trim();

            if (!isLogin) {
                let fd = new FormData();
                fd.append('entry.1289980302', name);
                fd.append('entry.1236148094', email);
                fd.append('entry.836205042', pass);
                await fetch(FORM_URL, { method: 'POST', body: fd, mode: 'no-cors' });
                alert("Registered! Please wait 10 seconds and Login.");
            } else {
                const res = await fetch(SHEET_WEB_APP);
                const data = await res.json();
                
                // C=2, D=3. Agar email/pass alag column me hai, numbers change karein
                const user = data.find(row => row[2] == email && row[3] == pass);
                
                if (user) {
                    alert("Login Success! ✅");
                    window.location.href = "https://www.google.com"; // Login ke baad kahan jana hai
                } else {
                    alert("Login Failed! Email ya Password check karein.");
                }
            }
        };
    </script>
</body>
</html>
